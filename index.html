<style>

<script>
(() => {
"use strict";
const CFG = window.APP_CONFIG;
const PER_TABLE = CFG.seatsPerTable || 12;
const APP_VERSION = "10.13-d";
const UA = navigator.userAgent;
const IS_IOS = /iPhone|iPad|iPod/.test(UA);
const IN_APP = /KAKAOTALK|Instagram|FBAN|FBAV|NAVER\(inapp|Line\//i.test(UA);
const IS_KAKAO = /KAKAOTALK/i.test(UA);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

/* ---------- 시간 표시 ---------- */
const DOW = ["일","월","화","수","목","금","토"];
function fmtDate(ms){ const d = new Date(ms); return `${d.getMonth()+1}/${d.getDate()}(${DOW[d.getDay()]}) ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`; }
function left(ms){
  let s = Math.max(0, Math.floor((ms - Date.now())/1000));
  const d = Math.floor(s/86400); s%=86400; const h = Math.floor(s/3600); s%=3600; const m = Math.floor(s/60); const sec = s%60;
  if (d) return `${d}일 ${h}시간`; if (h) return `${h}시간 ${m}분`; if (m) return `${m}분 ${sec}초`; return `${sec}초`;
}
function toLocalInput(ms){ const d = new Date(ms - new Date(ms).getTimezoneOffset()*60000); return d.toISOString().slice(0,16); }

/* ---------- 자리 배치 (순수 함수) ---------- */
function rand(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function shuffle(arr){ const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j = rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function sortEntries(entries){ return entries.slice().sort((a,b)=>(a.createdAt??Infinity)-(b.createdAt??Infinity) || (a.uid<b.uid?-1:1)); }
function splitEntries(m, entries){ const s = sortEntries(entries); return { confirmed: s.slice(0, m.capacity), waiting: s.slice(m.capacity) }; }
/* 신청 순서대로 한 명씩 남은 자리 카드 중 하나를 무작위로 뽑는 방식. 뽑은 순서를 기록으로 남김 */
function drawSeating(confirmed, by){
  const n = confirmed.length, at = Date.now();
  const t = Math.max(1, Math.ceil(n / PER_TABLE));
  const cards = [], tables = [];
  for (let k=0;k<t;k++){
    const size = Math.floor(n/t) + (k < n % t ? 1 : 0);
    tables.push({ table: k+1, seats: [] });
    for (let s=1;s<=size;s++) cards.push({ table: k+1, seat: s });
  }
  const steps = confirmed.map((p, i) => {
    const c = cards.splice(rand(cards.length), 1)[0];
    tables[c.table-1].seats.push({ seat: c.seat, uid: p.uid, name: p.name });
    return { n: i+1, uid: p.uid, name: p.name, table: c.table, seat: c.seat };
  });
  tables.forEach(tb => tb.seats.sort((a,b)=>a.seat-b.seat));
  return { seats: { assignedAt: at, tables: n ? tables : [] }, log: { drawnAt: at, byUid: by.uid, byName: by.name, byHost: !!by.host, multi: t > 1, steps } };
}
const minOf = m => m.minPlayers || CFG.defaultMinPlayers || 6;

/* ---------- 체험 모드 저장소 (이 기기 전용) ---------- */
function demoStore(){
  const KEY = "dumbul-meetup-demo";
  const uid = store.get("demo-uid") || ("u" + Math.random().toString(36).slice(2,10)); store.set("demo-uid", uid);
  let db = null; try { db = JSON.parse(store.get(KEY)); } catch {}
  if (!db || db.v !== 2){
    const now = Date.now(), H = 3600e3;
    const names = ["민수","지훈","서연","하늘","태호","유진","도윤","수아","현우","예린","준서","다은","시우","채원"];
    const mk = (pre, list, t0) => list.map((n,i)=>({ uid:pre+i, name:n, memo:"", createdAt: t0 + i*60e3 }));
    const e1 = mk("x", names, now - 5*H); e1[3].memo = "30분 늦어요";
    const e3 = mk("z", names.slice(4,8), now - 3*H);
    const past = mk("y", names.slice(0,9), now - 80*H);
    const pastDraw = drawSeating(past, { uid:"y0", name:"민수", host:true });
    db = { v:2, meetups: {
      ex1: { id:"ex1", title:"[예시] 금요 정기 토너먼트", date: now + 30*H, deadline: now + 2*H, location:"연남동 덤불라운지", capacity:12, minPlayers:6, memo:"바이인 3만원 / 리바이 1회\n늦으면 단톡에 미리 말해주세요", hostUid:"x0", hostName:"민수", seats:null, formedAt: now - 4.9*H, createdAt: now - 6*H },
      ex3: { id:"ex3", title:"[예시] 일요일 낮 캐시게임", date: now + 100*H, deadline: now + 90*H, location:"합정", capacity:9, minPlayers:6, memo:"", hostUid:"z0", hostName:"태호", seats:null, formedAt:null, createdAt: now - 3*H },
      ex2: { id:"ex2", title:"[예시] 지난주 번개", date: now - 70*H, deadline: now - 74*H, location:"망원동", capacity:9, minPlayers:6, memo:"", hostUid:"y0", hostName:"민수", seats: pastDraw.seats, formedAt: now - 79*H, createdAt: now - 90*H }
    }, entries: { ex1: Object.fromEntries(e1.map(e=>[e.uid,e])), ex3: Object.fromEntries(e3.map(e=>[e.uid,e])), ex2: Object.fromEntries(past.map(e=>[e.uid,e])) },
    draws: { ex2: pastDraw.log } };
  }
  const subs = new Set();
  const save = () => { store.set(KEY, JSON.stringify(db)); subs.forEach(f=>f()); };
  const on = f => { subs.add(f); setTimeout(f); return () => subs.delete(f); };
  const err = msg => Promise.reject(new Error(msg));
  const meName = () => S.name || "나";
  function seat(id, by){ const m = db.meetups[id]; const r = drawSeating(splitEntries(m, Object.values(db.entries[id])).confirmed, by); m.seats = r.seats; db.draws[id] = r.log; save(); }
  return {
    demo: true, uid,
    watchMeetups(cb){ return on(()=>cb(Object.values(db.meetups).sort((a,b)=>b.date-a.date))); },
    watchMeetup(id, cb){ return on(()=>cb(db.meetups[id] ? {...db.meetups[id]} : null)); },
    watchEntries(id, cb){ return on(()=>cb(Object.values(db.entries[id]||{}))); },
    watchDraw(id, cb){ return on(()=>cb(db.meetups[id]?.hostUid === uid ? (db.draws[id] || null) : null)); },
    async getEntries(id){ return Object.values(db.entries[id]||{}); },
    async createMeetup(m){ const id = "m"+Date.now().toString(36); db.meetups[id] = { ...m, id, hostUid: uid, seats: null, formedAt: null, createdAt: Date.now() }; db.entries[id] = {}; save(); return id; },
    async join(id, name, memo){
      const m = db.meetups[id]; if (Date.now() >= m.deadline) return err("모집이 마감됐어요");
      db.entries[id][uid] = { uid, name, memo, createdAt: Date.now() };
      if (!m.formedAt && Object.keys(db.entries[id]).length >= minOf(m)) m.formedAt = Date.now();
      save();
    },
    async cancel(id){ const m = db.meetups[id]; if (Date.now() >= m.deadline) return err("마감 후에는 모임장만 취소할 수 있어요"); delete db.entries[id][uid]; save(); },
    async removeEntry(id, who){ delete db.entries[id][who]; save(); },
    async closeNow(id){ db.meetups[id].deadline = Date.now(); save(); },
    async assignSeatsIfNeeded(id){ const m = db.meetups[id]; if (!m || m.seats || Date.now() < m.deadline) return; seat(id, { uid, name: meName(), host: m.hostUid === uid }); },
    async reseat(id){ seat(id, { uid, name: meName(), host: true }); },
    async deleteMeetup(id){ delete db.meetups[id]; delete db.entries[id]; delete db.draws[id]; save(); },
    pushSupported(){ return false; },
    async enablePush(){ throw new Error("체험 모드에서는 알림을 켤 수 없어요"); },
    async refreshPush(){}
  };
}

/* ---------- Firebase 저장소 (멤버 모두 공유) ---------- */
async function firebaseStore(cfg){
  const V = "10.12.2", base = `https://www.gstatic.com/firebasejs/${V}/`;
  const [{ initializeApp }, fs, au] = await Promise.all([import(base+"firebase-app.js"), import(base+"firebase-firestore.js"), import(base+"firebase-auth.js")]);
  const { getFirestore, collection, doc, setDoc, deleteDoc, updateDoc, onSnapshot, query, orderBy, limit, serverTimestamp, Timestamp, runTransaction, getDocs, writeBatch } = fs;
  const app = initializeApp(cfg); const db = getFirestore(app); const auth = au.getAuth(app);
  const user = await new Promise((res, rej) => { const un = au.onAuthStateChanged(auth, u => { if (u){ un(); res(u); } }); au.signInAnonymously(auth).catch(rej); });
  const ms = v => v instanceof Timestamp ? v.toMillis() : (v ?? null);
  const opt = { serverTimestamps: "estimate" };
  const toM = s => { const d = s.data(opt); return { ...d, id: s.id, date: ms(d.date), deadline: ms(d.deadline), createdAt: ms(d.createdAt) }; };
  const toE = s => { const d = s.data(opt); return { uid: s.id, name: d.name, memo: d.memo || "", createdAt: ms(d.createdAt) }; };
  const mref = id => doc(db, "meetups", id);
  const ecol = id => collection(db, "meetups", id, "entries");
  const dref = id => doc(db, "meetups", id, "private", "draw");
  const fail = e => console.error(e);
  // 쓰기 직전 로그인 확인 + 토큰 새로 받기 (카톡 등 인앱 브라우저 대비)
  async function fresh(force){
    if (!auth.currentUser) await au.signInAnonymously(auth);
    await auth.currentUser.getIdToken(!!force);
    return auth.currentUser.uid;
  }
  async function guarded(fn){
    try { await fresh(false); return await fn(); }
    catch (e){
      if (!String(e && e.code).includes("permission")) throw e;
      await fresh(true);                       // 토큰을 강제로 새로 받아 한 번 더 시도
      try { return await fn(); }
      catch (e2){ try { e2.authed = !!auth.currentUser; } catch {} throw e2; }
    }
  }

  /* --- 푸시 알림 (FCM) --- */
  const pushSupported = () => "Notification" in window && "serviceWorker" in navigator && "PushManager" in window && !!CFG.vapidKey && !CFG.vapidKey.startsWith("여기에");
  let messaging = null, msgMod = null;
  async function pushToken(){
    msgMod = msgMod || await import(base+"firebase-messaging.js");
    if (!(await msgMod.isSupported())) throw new Error("이 브라우저는 알림을 지원하지 않아요");
    const reg = await navigator.serviceWorker.register("firebase-messaging-sw.js?cfg=" + encodeURIComponent(JSON.stringify(cfg)), { scope: "./" });
    await navigator.serviceWorker.ready;
    if (!messaging){
      messaging = msgMod.getMessaging(app);
      msgMod.onMessage(messaging, p => { const n = p.notification || {}; toast([n.title, n.body].filter(Boolean).join(" · ")); });
    }
    const token = await msgMod.getToken(messaging, { vapidKey: CFG.vapidKey, serviceWorkerRegistration: reg });
    await setDoc(doc(db, "pushTokens", user.uid), { token, updatedAt: serverTimestamp() });
    return token;
  }

  return {
    demo: false, get uid(){ return (auth.currentUser && auth.currentUser.uid) || user.uid; },
    watchMeetups(cb){ return onSnapshot(query(collection(db,"meetups"), orderBy("date","desc"), limit(40)), s => cb(s.docs.map(toM)), fail); },
    watchMeetup(id, cb){ return onSnapshot(mref(id), s => cb(s.exists() ? toM(s) : null), fail); },
    watchEntries(id, cb){ return onSnapshot(ecol(id), s => cb(s.docs.map(toE)), fail); },
    watchDraw(id, cb){ return onSnapshot(dref(id), s => cb(s.exists() ? s.data() : null), () => cb(null)); },
    async getEntries(id){ return (await getDocs(ecol(id))).docs.map(toE); },
    async createMeetup(m){
      const ref = doc(collection(db,"meetups"));
      await guarded(() => setDoc(ref, { title:m.title, location:m.location, memo:m.memo, capacity:m.capacity, minPlayers:m.minPlayers, hostName:m.hostName,
        date: Timestamp.fromMillis(m.date), deadline: Timestamp.fromMillis(m.deadline), hostUid: user.uid, seats: null,
        appUrl: location.origin + location.pathname, createdAt: serverTimestamp(), hostUid: auth.currentUser.uid }));
      return ref.id;
    },
    async join(id, name, memo){ await guarded(() => setDoc(doc(ecol(id), auth.currentUser.uid), { name, memo, createdAt: serverTimestamp() })); },
    async cancel(id){ await guarded(() => deleteDoc(doc(ecol(id), auth.currentUser.uid))); },
    async removeEntry(id, who){ await deleteDoc(doc(ecol(id), who)); },
    async closeNow(id){ await updateDoc(mref(id), { deadline: Timestamp.now() }); },
    async assignSeatsIfNeeded(id){
      const entries = await this.getEntries(id);
      await runTransaction(db, async tx => {
        const s = await tx.get(mref(id)); if (!s.exists()) return;
        const m = toM(s); if (m.seats || Date.now() < m.deadline) return;
        const r = drawSeating(splitEntries(m, entries).confirmed, { uid: user.uid, name: S.name || "", host: m.hostUid === user.uid });
        tx.update(mref(id), { seats: r.seats });
        tx.set(dref(id), r.log);
      });
    },
    async reseat(id){
      const entries = await this.getEntries(id);
      await runTransaction(db, async tx => {
        const s = await tx.get(mref(id));
        const r = drawSeating(splitEntries(toM(s), entries).confirmed, { uid: user.uid, name: S.name || "", host: true });
        tx.update(mref(id), { seats: r.seats });
        tx.set(dref(id), r.log);
      });
    },
    async deleteMeetup(id){
      const b = writeBatch(db); (await getDocs(ecol(id))).docs.forEach(d => b.delete(d.ref)); b.delete(dref(id)); b.delete(mref(id)); await b.commit();
    },
    pushSupported,
    async enablePush(){
      if (!pushSupported()) throw new Error("이 브라우저에서는 알림을 받을 수 없어요");
      const perm = Notification.permission === "default" ? await Notification.requestPermission() : Notification.permission;
      if (perm !== "granted") throw new Error("알림이 차단돼 있어요. 브라우저 설정에서 허용해 주세요");
      await pushToken();
    },
    async refreshPush(){ if (pushSupported() && Notification.permission === "granted") await pushToken().catch(fail); }
  };
}

/* ---------- 상태 ---------- */
const S = { api:null, view:"list", id:null, meetups:[], meetup:undefined, entries:[], name: store.get("nickname") || "", memoDraft:"", busy:false, confirm:null, unsub:[] };
const isPast = m => Date.now() >= m.deadline;
const ended = m => Date.now() > m.date + 12*3600e3;

function toast(msg, ms){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms || 2400); }
function errMsg(e){
  const c = String((e && e.code) || ""), step = e && e.step ? `${e.step} 실패 · ` : "";
  if (c.includes("permission")) return e.authed === false || IN_APP
    ? `${step}로그인이 안 됐어요. 카톡 말고 ${IS_IOS ? "Safari" : "크롬"}에서 열어주세요 [${c}]`
    : `${step}권한이 없어요 (마감됐거나 본인 것이 아님) [${c}]`;
  return `${step}${e?.message || "잠시 후 다시 시도해 주세요"}${c ? ` [${c}]` : ""}`;
}
const tag = (step, p) => p.catch(e => { try { e.step = step; } catch {} throw e; });

/* ---------- 라우팅 ---------- */
function route(){
  const p = new URLSearchParams(location.search); const h = location.hash.replace(/^#/, "");
  const id = p.get("m") || (h.startsWith("m=") ? h.slice(2) : null);
  const view = h === "new" ? "new" : id ? "detail" : "list";
  S.unsub.forEach(f=>f()); S.unsub = []; S.view = view; S.id = id; S.confirm = null; S.meetup = undefined; S.entries = []; S.memoDraft = ""; S.draw = null; S.showDraw = false;
  if (view === "list") S.unsub.push(S.api.watchMeetups(ms => { S.meetups = ms; autoSeatAll(); render(); }));
  if (view === "detail"){
    let drawSub = null;
    S.unsub.push(S.api.watchMeetup(id, m => {
      const prev = S.meetup;
      S.meetup = m; autoSeat();
      // 실제 모드에서는 서버 푸시가 오므로, 체험 모드에서만 화면 안 알림
      if (S.api.demo && prev && !prev.formedAt && m && m.formedAt) toast(`모임 성사! ${minOf(m)}명이 모였어요`);
      // 추첨 기록은 모임장 기기에서만 구독 (규칙에서도 모임장만 읽기 허용)
      if (m && m.hostUid === S.api.uid && !drawSub){ drawSub = S.api.watchDraw(id, d => { S.draw = d; render(); }); S.unsub.push(drawSub); }
      render();
    }));
    S.unsub.push(S.api.watchEntries(id, es => { S.entries = es; render(); }));
  }
  render(); window.scrollTo(0,0);
}
function go(q){ history.pushState(null, "", q); route(); }
const linkFor = id => location.origin + location.pathname + "?m=" + encodeURIComponent(id);

/* 마감 시간이 지난 모임은 누가 열든 자동으로 자리배치 (중복 배치는 트랜잭션이 막음) */
const tried = new Set();
function autoSeat(){ const m = S.meetup; if (m && !m.seats && isPast(m) && !tried.has(m.id)){ tried.add(m.id); S.api.assignSeatsIfNeeded(m.id).catch(e=>{ tried.delete(m.id); console.error(e); }); } }
function autoSeatAll(){ S.meetups.forEach(m => { if (!m.seats && isPast(m) && !ended(m) && !tried.has(m.id)){ tried.add(m.id); S.api.assignSeatsIfNeeded(m.id).catch(()=>tried.delete(m.id)); } }); }

function seatPositions(n){
  // 딜러는 위쪽 가운데, 1번부터 시계방향
  return Array.from({length:n}, (_, i) => {
    const a = (-90 + (i+1) * 360/(n+1)) * Math.PI/180;
    return { x: 50 + 44*Math.cos(a), y: 50 + 42*Math.sin(a) };
  });
}
function renderSeating(m){
  const me = S.api.uid;
  return `<div class="tables">${m.seats.tables.map(t => {
    const pos = seatPositions(t.seats.length);
    return `<div class="tbl"><h4><span>${m.seats.tables.length>1 ? `${t.table}번 테이블` : "테이블"}</span><span class="num">${t.seats.length}명</span></h4>
      <div class="oval" role="img" aria-label="자리배치도"><div class="felt">${esc(CFG.clubName)}</div><span class="dealer">딜러</span>
      ${t.seats.map((s,i)=>`<div class="seat ${s.uid===me?"me":""}" style="left:${pos[i].x}%;top:${pos[i].y}%"><span class="c">${s.seat}</span><span class="l">${esc(s.name)}</span></div>`).join("")}
      </div>
      <div class="seatlist">${t.seats.map(s=>`<div class="${s.uid===me?"me":""}"><span class="num">${s.seat}</span><span>${esc(s.name)}</span></div>`).join("")}</div>
    </div>`; }).join("")}</div>
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">${fmtDate(m.seats.assignedAt)} 무작위 배치</p>`;
}

function renderDetail(){
  const m = S.meetup;
  if (m === undefined) return `<p class="muted">불러오는 중…</p>`;
  if (m === null) return `<div class="empty">모임이 삭제됐거나 링크가 잘못됐어요.<br><br><button class="btn" data-act="home">목록으로</button></div>`;
  const me = S.api.uid, host = m.hostUid === me, past = isPast(m);
  const { confirmed, waiting } = splitEntries(m, S.entries);
  const mineIdx = confirmed.findIndex(e=>e.uid===me), waitIdx = waiting.findIndex(e=>e.uid===me);
  const joined = mineIdx >= 0 || waitIdx >= 0;
  const pct = Math.min(100, Math.round(confirmed.length / m.capacity * 100));
  let mySeat = null; if (m.seats) for (const t of m.seats.tables) for (const s of t.seats) if (s.uid===me) mySeat = { t: t.table, s: s.seat, multi: m.seats.tables.length>1 };

  let action;
  if (!past){
    action = joined
      ? `<div class="status ${mineIdx>=0?"ok":"wait"}">${mineIdx>=0 ? `참여 확정 · ${mineIdx+1}번째 신청` : `대기 ${waitIdx+1}번 · 누가 취소하면 자동으로 확정돼요`}</div>
         <button class="btn danger block" data-act="cancel" ${S.busy?"disabled":""}>신청 취소</button>`
      : `<label class="f">한 줄 메모 <small>선택 · 예: 30분 늦어요</small><input type="text" id="memo" maxlength="60" value="${esc(S.memoDraft)}"></label>
         <button class="btn ${confirmed.length>=m.capacity?"":"primary"} block" data-act="join" ${S.busy?"disabled":""}>${confirmed.length>=m.capacity ? "대기자로 신청" : `${esc(S.name||"")} 참여 신청`}</button>`;
  } else {
    action = mySeat ? `<div class="status ok">내 자리: ${mySeat.multi?`${mySeat.t}번 테이블 `:""}<span class="num">${mySeat.s}</span>번</div>`
      : joined ? `<div class="status wait">${m.seats ? "대기자로 마감됐어요" : "자리배치 중…"}</div>`
      : `<div class="status muted">모집이 마감됐어요</div>`;
    if (joined) action += `<p class="muted" style="margin:0;font-size:13px">마감 후 취소는 모임장에게 말해주세요.</p>`;
  }

  // 성사 상태
  const min = minOf(m), total = S.entries.length, need = Math.max(0, min - total);
  const chips = Array.from({length:min}, (_, i) => `<i class="${i < total ? "on" : ""}"></i>`).join("");
  const formedBox = need === 0
    ? `<div class="formed yes"><span>모임 성사! 최소 ${min}명 넘었어요</span><span class="chips" aria-hidden="true">${chips}</span></div>`
    : `<div class="formed no"><span>성사까지 <b class="num">${need}</b>명 더 필요 (최소 ${min}명)</span><span class="chips" aria-hidden="true">${chips}</span></div>`;

  // 알림 켜기
  let push = "";
  if (!ended(m) && (joined || host)){
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent), standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    if (S.api.demo) push = `<div class="pushrow">체험 모드에서는 폰 알림이 가지 않아요.</div>`;
    else if (!S.api.pushSupported()) push = `<div class="pushrow">${isIOS && !standalone ? "아이폰은 Safari 공유 버튼 → <b>홈 화면에 추가</b> 후, 그 아이콘으로 열어야 알림을 받을 수 있어요." : "이 브라우저에서는 폰 알림을 받을 수 없어요."}</div>`;
    else if (Notification.permission === "granted") push = `<div class="pushrow">🔔 알림 켜짐 · 모임이 성사되면 알려드려요</div>`;
    else if (Notification.permission === "denied") push = `<div class="pushrow">알림이 차단돼 있어요. 브라우저 설정에서 이 사이트 알림을 허용해 주세요.</div>`;
    else push = `<div class="pushrow"><button class="btn sm" data-act="push">🔔 알림 켜기</button><span>성사되면 폰으로 알려드려요</span></div>`;
  }

  // 추첨 기록 (모임장 전용)
  let drawSec = "";
  if (host && m.seats && S.draw && S.draw.steps){
    const d = S.draw;
    const who = d.byHost ? "모임장(나)" : `${d.byName || "멤버"}님 폰에서 자동`;
    drawSec = `<h2 class="sec">추첨 기록 <span class="n">${d.steps.length}</span><span class="spacer" style="flex:1"></span><button class="btn sm ghost" data-act="toggle-draw">${S.showDraw ? "접기" : "펼치기"}</button></h2>
      <p class="drawhead">${fmtDate(d.drawnAt)} · ${esc(who)} 추첨 · 신청 순서대로 남은 자리 카드를 한 장씩 뽑음 · 모임장에게만 보여요</p>
      ${S.showDraw ? `<ol class="drawlog">${d.steps.map(s => `<li><span class="k">${s.n}</span><span class="who">${esc(s.name)}<small>신청 ${s.n}번</small></span><span class="to">${d.multi ? `${s.table}T-` : ""}${s.seat}번</span></li>`).join("")}</ol>` : ""}`;
  }

  const li = (e, i) => `<li><span class="ord">${i+1}</span><span class="nm">${esc(e.name)}</span>${e.uid===me?`<span class="you">나</span>`:""}<span class="memo">${esc(e.memo)}</span>
    ${host && e.uid!==me ? `<button class="btn sm ghost x" data-act="kick" data-uid="${esc(e.uid)}" aria-label="${esc(e.name)} 신청 취소">빼기</button>` : ""}</li>`;

  let conf = "";
  if (S.confirm){
    const c = S.confirm;
    conf = `<div class="confirm"><div>${esc(c.text)}</div><div class="hostbox"><button class="btn sm red" data-act="confirm-yes">${esc(c.yes)}</button><button class="btn sm" data-act="confirm-no">그만두기</button></div></div>`;
  }

  return `<section class="hero">
    <div style="display:flex;gap:6px;flex-wrap:wrap">${statusPill(m, host?"내 모임":"")}</div>
    <h1>${esc(m.title)}</h1>
    <dl class="facts"><dt>일시</dt><dd>${fmtDate(m.date)}</dd>${m.location?`<dt>장소</dt><dd>${esc(m.location)}</dd>`:""}<dt>모임장</dt><dd>${esc(m.hostName||"")}</dd><dt>모집 마감</dt><dd>${fmtDate(m.deadline)}</dd></dl>
    ${m.memo ? `<div class="note">${esc(m.memo)}</div>` : ""}
    ${!past ? `<div class="clock">마감까지 <span class="num" data-left="${m.deadline}">${left(m.deadline)}</span></div>` : ""}
    ${formedBox}
    <div><div class="meta" style="justify-content:space-between;margin-bottom:6px"><span>확정 <b class="num">${confirmed.length}</b> / ${m.capacity}</span><span>대기 <b class="num">${waiting.length}</b></span></div><div class="bar"><i style="width:${pct}%"></i></div></div>
    <button class="btn sm" data-act="share">링크 복사해서 단톡에 공유</button>
  </section>
  <section class="action">${action}${push}</section>

  ${m.seats ? `<h2 class="sec">자리배치</h2>${renderSeating(m)}` : past ? `<h2 class="sec">자리배치</h2><div class="empty">자리배치 중…</div>` : ""}

  <h2 class="sec">참여 확정 <span class="n">${confirmed.length}</span></h2>
  ${confirmed.length ? `<ul class="people">${confirmed.map(li).join("")}</ul>` : `<div class="empty">첫 번째로 신청해 보세요.</div>`}
  ${waiting.length ? `<h2 class="sec">대기자 <span class="n">${waiting.length}</span></h2><ul class="people wait">${waiting.map((e,i)=>li(e,i)).join("")}</ul>` : ""}

  ${host ? `<h2 class="sec">모임장 메뉴</h2><div class="hostbox">
     ${!past ? `<button class="btn sm" data-act="close">지금 마감하고 자리배치</button>` : `<button class="btn sm" data-act="reseat">자리 다시 뽑기</button>`}
     <button class="btn sm danger" data-act="delete">모임 삭제</button></div>${conf}${drawSec}` : ""}`;
}

function render(){
  topbar();
  const app = $("#app");
  const active = document.activeElement; const focusId = active && active.id; const caret = active && active.selectionStart;
  app.innerHTML = S.view === "new" ? renderNew() : S.view === "detail" ? renderDetail() : renderList();
  if (focusId){ const el = document.getElementById(focusId); if (el){ el.focus(); try { el.setSelectionRange(caret, caret); } catch {} } }
}

/* ---------- 닉네임 ---------- */
function askName(then){
  $("#overlay").innerHTML = `<div class="sheet-bg"><form class="sheet" id="nickForm">
    <h3>닉네임</h3><p class="muted" style="margin:0;font-size:14px">신청 명단과 자리배치에 이 이름이 보여요.</p>
    <input type="text" id="nick" maxlength="12" required value="${esc(S.name)}" placeholder="예: 진호">
    <button class="btn primary block" type="submit">저장</button>
    ${S.name ? `<button class="btn ghost block" type="button" data-act="nick-close">닫기</button>` : ""}</form></div>`;
  const f = $("#nickForm"); setTimeout(()=>$("#nick").focus(), 50);
  f.onsubmit = e => { e.preventDefault(); const v = $("#nick").value.trim(); if (!v) return; S.name = v; store.set("nickname", v); $("#overlay").innerHTML = ""; render(); then && then(); };
}
const needName = fn => S.name ? fn() : askName(fn);

/* ---------- 이벤트 ---------- */
async function run(fn, ok){ if (S.busy) return; S.busy = true; render(); try { await fn(); if (ok) toast(ok); } catch(e){ console.error(e); toast(errMsg(e), 7000); } finally { S.busy = false; render(); } }

document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g){ go("?m=" + encodeURIComponent(g.dataset.go)); return; }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = S.id;
  if (a === "home") go(location.pathname);
  else if (a === "nick") askName();
  else if (a === "external") openExternal();
  else if (a === "nick-close") $("#overlay").innerHTML = "";
  else if (a === "new") needName(()=>go(location.pathname + "#new"));
  else if (a === "push") S.api.enablePush().then(()=>{ toast("알림을 켰어요"); render(); }, e=>{ toast(errMsg(e)); render(); });
  else if (a === "toggle-draw"){ S.showDraw = !S.showDraw; render(); }
  else if (a === "join"){
    // 신청 버튼을 누르는 순간(사용자 동작 안에서) 알림 권한도 함께 요청
    if (!S.api.demo && S.api.pushSupported() && Notification.permission === "default") S.api.enablePush().then(render, ()=>render());
    needName(()=>run(()=>tag("참여 신청", S.api.join(id, S.name, (S.memoDraft||"").trim())).then(()=>{ S.memoDraft=""; }), "신청 완료!"));
  }
  else if (a === "cancel") run(()=>S.api.cancel(id), "신청을 취소했어요");
  else if (a === "share"){
    const url = linkFor(id), m = S.meetup, text = `[${CFG.clubName}] ${m.title}\n${fmtDate(m.date)}${m.location?" · "+m.location:""}\n참여신청 👉 ${url}`;
    if (navigator.share) navigator.share({ title: m.title, text, url }).catch(()=>{});
    else navigator.clipboard.writeText(text).then(()=>toast("링크를 복사했어요"), ()=>toast(url));
  }
  else if (a === "close"){ S.confirm = { text: "지금 모집을 마감하고 자리를 뽑을까요?", yes: "마감", fn: ()=>S.api.closeNow(id) }; render(); }
  else if (a === "reseat"){ S.confirm = { text: "자리를 새로 뽑으면 지금 배치는 사라져요.", yes: "다시 뽑기", fn: ()=>S.api.reseat(id), ok: "자리를 다시 뽑았어요" }; render(); }
  else if (a === "delete"){ S.confirm = { text: "모임과 신청 명단이 모두 삭제돼요.", yes: "삭제", fn: async()=>{ await S.api.deleteMeetup(id); go(location.pathname); } }; render(); }
  else if (a === "kick"){ const who = b.dataset.uid, n = S.entries.find(x=>x.uid===who)?.name || ""; S.confirm = { text: `${n}님의 신청을 취소할까요?`, yes: "빼기", fn: ()=>S.api.removeEntry(id, who) }; render(); }
  else if (a === "confirm-no"){ S.confirm = null; render(); }
  else if (a === "confirm-yes"){ const c = S.confirm; S.confirm = null; run(c.fn, c.ok); }
});
document.addEventListener("input", e => { if (e.target.id === "memo") S.memoDraft = e.target.value; });
document.addEventListener("submit", e => {
  if (e.target.id !== "newForm") return; e.preventDefault();
  const v = id => $(id).value.trim(); const err = $("#f-err");
  const date = new Date(v("#f-date")).getTime(), deadline = new Date(v("#f-deadline")).getTime(), capacity = parseInt(v("#f-cap"), 10), minPlayers = parseInt(v("#f-min"), 10);
  const bad = !v("#f-title") ? "모임 이름을 적어주세요" : isNaN(date) || isNaN(deadline) ? "날짜를 확인해 주세요"
    : deadline <= Date.now() ? "모집 마감은 지금 이후여야 해요" : deadline > date ? "모집 마감은 모임 시작 전이어야 해요"
    : !(capacity >= 2 && capacity <= 36) ? "정원은 2~36명"
    : !(minPlayers >= 2 && minPlayers <= capacity) ? "최소 인원은 2명 이상, 정원 이하로 정해주세요" : "";
  if (bad){ err.textContent = bad; err.hidden = false; return; }
  const joinToo = $("#f-join").checked;
  if (!S.api.demo && S.api.pushSupported() && Notification.permission === "default") S.api.enablePush().catch(()=>{});
  needName(()=>run(async () => {
    const id = await tag("모임 저장", S.api.createMeetup({ title: v("#f-title"), location: v("#f-loc"), memo: $("#f-memo").value.trim(), capacity, minPlayers, date, deadline, hostName: S.name }));
    if (joinToo) await tag("모임장 참여 신청", S.api.join(id, S.name, ""));
    history.replaceState(null, "", "?m=" + encodeURIComponent(id)); route();
  }, "모임을 올렸어요"));
});
window.addEventListener("popstate", route);

/* 남은 시간 표시 + 마감 순간 자동 배치 */
setInterval(() => {
  document.querySelectorAll("[data-left]").forEach(el => { el.textContent = left(+el.dataset.left); });
  if (S.view === "detail" && S.meetup && !S.meetup.seats && isPast(S.meetup)){ if (!tried.has(S.meetup.id)) { autoSeat(); render(); } }
  if (S.view === "list" && S.meetups.some(m => !m.seats && isPast(m) && !ended(m) && !tried.has(m.id))) { autoSeatAll(); render(); }
}, 1000);

function openExternal(){
  const url = location.href;
  if (IS_KAKAO){ location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(url); return; }
  if (!IS_IOS){ location.href = "intent://" + url.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end"; return; }
  navigator.clipboard?.writeText(url).then(()=>toast("주소를 복사했어요. Safari에 붙여넣어 주세요", 5000), ()=>toast(url, 8000));
}
// 카톡 인앱 브라우저면 처음 한 번 자동으로 기본 브라우저로 넘김
if (IS_KAKAO && !store.get("kakao-ext-tried")){ store.set("kakao-ext-tried", "1"); setTimeout(openExternal, 300); }

/* ---------- 시작 ---------- */
(async () => {
  const configured = CFG.firebase && CFG.firebase.apiKey && !CFG.firebase.apiKey.startsWith("여기에");
  try { S.api = configured ? await firebaseStore(CFG.firebase) : demoStore(); }
  catch (e){ console.error(e); $("#app").innerHTML = `<div class="empty">서버에 연결하지 못했어요.<br><small>${esc(e.message)}</small></div>`; return; }
  if (S.api.demo) $("#demo").hidden = false;
  if (IN_APP) $("#inapp").hidden = false;
  route();
  S.api.refreshPush();  // 이미 알림을 허용한 기기는 토큰을 최신으로 갱신
  if (!S.name) askName();
})();
})();
</script>
</body>
</html>
